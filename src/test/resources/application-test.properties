spring.datasource.url=jdbc:mysql://localhost:3306/tasktracker_test?serverTimezone=UTC
spring.datasource.username=tasktracker_test
spring.datasource.password=test_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

