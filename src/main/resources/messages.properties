## Invalid request errors
error.invalid-request=The request contains invalid data.
error.request.body.invalid=The request body is missing or contains invalid data.
error.request.parameter.invalid=A request parameter has an invalid value.
error.request.parameter.missing=A required request parameter is missing.
error.request.method-not-allowed=The HTTP method is not supported.

## Pagination errors
error.pagination.page.invalid=Page index cannot be negative.
error.pagination.size.invalid=Page size must be between 1 and 100.

## Invalid filter request errors
error.filter.search.max=Search must be at most {0} characters.
error.filter.owner-username.max=Owner username must be at most {0} characters.
error.filter.deadline.conflict=Deadline cannot be combined with deadlineAfter or deadlineBefore.
error.filter.without-deadline.conflict=withoutDeadline cannot be combined with deadline filters.
error.filter.deadline-range.invalid=deadlineAfter cannot be later than deadlineBefore.

## Security errors
error.security.unauthorized=Authentication is required.
error.security.forbidden=You do not have permission to perform this action.

## Task errors
error.task-not-found=Task with such id not found.

## User errors
error.user.username.already-exists=This username is already taken.
error.user.authenticated.not-found=Authenticated user was not found.

## Internal errors
error.internal-error=An unexpected error occurred. Please try again later.

## DTO task request errors
validation.task.title.not-blank=Title cannot be blank.
validation.task.title.max=Title must be at most 100 characters.
validation.task.description.max=Description must be at most 600 characters.
validation.task.priority.not-null=Priority cannot be null.
validation.task.deadline.not-in-the-past=Deadline cannot be in the past.
validation.task.category.not-null=Category cannot be null.
validation.task.status.not-null=Status cannot be null.

## DTO user request errors
validation.user.name.is-required=Name is required.
validation.user.name.length=Name must be between 3 and 50 characters.
validation.user.username.is-required=Username is required.
validation.user.username.length=Username must be between 3 and 50 characters.
validation.user.password.is-required=Password is required.
validation.user.password.length=Password length must be between 8 and 72 characters.
validation.user.username.pattern=Username may contain only Latin letters, digits, dots and underscores.
validation.user.password.pattern=Password must contain at least one uppercase letter, one digit, and one special character.

